services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend 
    container_name: asistente_us_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: 
      context: . 
    container_name: asistente_us_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app:/app/backend
      - API_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data: