services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend 
    container_name: asistente_us_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./Documentos_US:/Documentos_US

  frontend:
    build: 
      context: ./frontend
    container_name: asistente_us_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend

  langfuse_db:
    image: postgres:15
    container_name: langfuse_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    ports:
      - "5435:5432"
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse_web
    restart: always
    depends_on:
      - langfuse_db
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse_db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=my_ultra_secret_nextauth_string_for_local_tfg
      - SALT=my_ultra_secret_salt_string_for_local_tfg

volumes:
  postgres_data:
  langfuse_db_data: